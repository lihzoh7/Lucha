<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Guide Test</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        video { width: 100%; max-width: 400px; border-radius: 10px; background: #222; transform: scaleX(1); }
        button { background: #007bff; color: white; border: none; padding: 15px 25px; margin: 10px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 80%; max-width: 300px; }
        button:active { background: #0056b3; }
        input { padding: 12px; width: 75%; max-width: 280px; border-radius: 5px; border: 1px solid #44App; margin-bottom: 10px; font-size: 16px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #333; border-radius: 8px; background: #1e1e1e; }
    </style>
</head>
<body>

    <h1>AI Assistive Guide</h1>

    <div class="section">
        <h3>1. Camera & Audio Guide Test</h3>
        <video id="videoFeed" autoplay playsinline muted></video>
        <br>
        <button onclick="startCamera()">Start Live Camera</button>
        <br>
        <button onclick="speakInstruction('Go straight')">Test: Go Straight</button>
        <button onclick="speakInstruction('Turn left')">Test: Turn Left</button>
        <button onclick="speakInstruction('Obstacle detected, stop')">Test: Danger Stop</button>
    </div>

    <div class="section">
        <h3>2. Navigation Setup</h3>
        <button onclick="getLocation()">Get Current Location</button>
        <p id="locationDisplay">Location: Not detected yet</p>
        
        <input type="text" id="destinationInput" placeholder="Enter destination (e.g. Corner House)">
        <button onclick="startNavigation()">Start Navigation</button>
    </div>

    <script>
        // Initialize Camera Stream
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, // Uses the back camera
                    audio: false 
                });
                document.getElementById('videoFeed').srcObject = stream;
                speakInstruction("Camera active. Beginning stream visualization.");
            } catch (err) {
                alert("Error accessing camera: " + err.message);
            }
        }

        // Native Text to Speech Engine
        function speakInstruction(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any current speaking immediately
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0; // Normal speech rate
                window.speechSynthesis.speak(utterance);
            } else {
                console.log("Speech synthesis not supported on this device.");
            }
        }

        // Capture Phone's Live GPS
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    document.getElementById('locationDisplay').innerText = `Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`;
                    speakInstruction("Location successfully locked.");
                }, (error) => {
                    alert("Error getting location: " + error.message);
                });
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        // Navigation Logic Trigger
        function startNavigation() {
            const dest = document.getElementById('destinationInput').value;
            if (!dest) {
                speakInstruction("Please type a destination first.");
                return;
            }
            speakInstruction(`Routing calculated for ${dest}. Proceed straight for ten meters.`);
        }
    </script>
</body>
</html>
